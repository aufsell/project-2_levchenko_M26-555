image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  paths:
    - .uv-cache/

lint:
  stage: lint
  script:
    - uv sync --locked
    - uv run --locked ruff check .
    - uv run --locked ruff format --check .

tests:
  stage: test
  script:
    - uv sync --locked
    - uv run --locked python -m unittest discover -s tests -p 'test_*.py' -v
